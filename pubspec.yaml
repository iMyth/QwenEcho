name: qwen_echo
description: On-device air-gapped simultaneous interpretation app.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  # Local model provisioning (air-gapped): resolve the app sandbox directory
  # for GGUF and sherpa-onnx model files. No network is used.
  path_provider: ^2.1.4
  # Local LLM inference via llama.cpp GGUF.
  llamadart: ^0.8.14
  # HTTP client for model downloads.
  http: ^1.2.0
  # Connection state detection for WiFi checks.
  connectivity_plus: ^6.0.3
  # Archive extraction for ASR model (tar.bz2).
  # Using ^4.0.9 to match llamadart's dependency.
  archive: ^4.0.9

# The pub-cache copy of path_provider_foundation 2.6.0 is incomplete (missing its
# darwin/ native sources + podspec) due to an interrupted download, which breaks
# the iOS CocoaPods integration. Pin to 2.4.1, which is intact locally and needs
# no network to resolve.
dependency_overrides:
  path_provider_foundation: 2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Models are NOT bundled as Flutter assets — they're too large (~750MB).
  # Instead, they're downloaded via scripts/setup_models.sh or imported by
  # the user, and loaded directly from the filesystem at runtime.
  # See README.md for model provisioning instructions.
