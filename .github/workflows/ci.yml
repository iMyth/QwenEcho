name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (static analysis)
        run: flutter analyze --fatal-infos

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Run tests
        run: flutter test --no-pub

  build-ios:
    name: iOS Build (no-sign)
    runs-on: macos-latest
    timeout-minutes: 30
    # Only run on PRs to avoid burning macOS minutes on every push
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Install CocoaPods dependencies (Pods/ is gitignored)
      - name: Pod install
        run: cd ios && pod install

      # Xcode resolves the sherpa-onnx-spm SPM package automatically.
      # Models are NOT needed for build verification — only for runtime.
      # Disable Flutter's SPM integration — we use CocoaPods + Xcode SPM directly.
      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign --no-pub --no-swift-package-manager

  build-apk:
    name: Android Build (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only run on PRs to avoid burning minutes on every push
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # The sherpa-onnx AAR is auto-downloaded by the Gradle task.
      # Models are NOT needed for build verification — only for runtime.
      - name: Build APK (debug)
        run: flutter build apk --debug --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-echo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
